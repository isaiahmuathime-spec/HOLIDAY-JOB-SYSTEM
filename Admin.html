<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard - Holiday Job</title>
  
  <script>
    if (localStorage.getItem('hjsAdminLoggedIn') !== 'true') {
      window.location.replace('LoginHJS.html');
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
  
  <style>
    :root {
      --bg-color: #FDF5E6; /* OldLace / Cream */
      --text-color: #4A3018; /* Dark Brown */
      --card-bg: #FFF8DC; /* Cornsilk */
      --card-border: #DEB887; /* BurlyWood */
      --navbar-bg: #8B4513; /* SaddleBrown */
      --navbar-text: #FDF5E6;
      --btn-bg: #A0522D; /* Sienna */
      --btn-hover: #CD853F; /* Peru */
    }

    [data-theme="dark"] {
      --bg-color: #2b1f1a;
      --text-color: #FDF5E6;
      --card-bg: #3E2723;
      --card-border: #5C4033;
      --navbar-bg: #1e1310;
      --navbar-text: #FDF5E6;
      --btn-bg: #8B4513;
      --btn-hover: #A0522D;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    .navbar {
      background-color: var(--navbar-bg);
      transition: background-color 0.3s;
    }

    .navbar-brand, .nav-link {
      color: var(--navbar-text) !important;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: background-color 0.3s, border-color 0.3s;
      margin-bottom: 20px;
    }

    .card-header {
      background-color: rgba(0,0,0,0.05);
      font-weight: bold;
      border-bottom: 1px solid var(--card-border);
    }

    .btn-custom {
      background-color: var(--btn-bg);
      color: white;
      border: none;
    }

    .btn-custom:hover {
      background-color: var(--btn-hover);
      color: white;
    }

    .theme-toggle {
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--navbar-text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .notification-list {
      list-style-type: none;
      padding: 0;
    }

    .notification-item {
      padding: 15px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .notification-item:last-child {
      border-bottom: none;
    }

    .notification-icon {
      background-color: var(--navbar-bg);
      color: var(--navbar-text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="#"><i class="fas fa-shield-alt me-2"></i> Admin Dashboard</a>
    <div class="d-flex align-items-center ms-auto">
      <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <i class="fas fa-moon" id="themeIcon"></i>
      </div>
      <button class="btn btn-sm btn-outline-light ms-4" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="mb-4">Welcome, Administrator</h2>
  
  <div class="row">
    <div class="col-lg-4 mb-4">
      <div class="card">
        <div class="card-body text-center">
          <h1 class="display-4" id="totalEnrollments">0</h1>
          <p class="mb-0">Total Enrollments</p>
        </div>
      </div>
    </div>
    
    <div class="col-lg-8 mb-4">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="fas fa-bell me-2"></i> Recent Applications</span>
          <button class="btn btn-sm btn-custom" onclick="clearNotifications()">Clear All</button>
        </div>
        <div class="card-body p-0">
          <ul class="notification-list" id="notificationList">
            <!-- Notifications will be populated here -->
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Theme logic
  const savedTheme = localStorage.getItem('adminTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('adminTheme', newTheme);
    updateThemeIcon(newTheme);
  }

  function updateThemeIcon(theme) {
    const icon = document.getElementById('themeIcon');
    if (theme === 'dark') {
      icon.className = 'fas fa-sun';
    } else {
      icon.className = 'fas fa-moon';
    }
  }

  function logout() {
    localStorage.removeItem('hjsAdminLoggedIn');
    window.location.href = 'LoginHJS.html';
  }

  function loadNotifications() {
    const enrollments = JSON.parse(localStorage.getItem('hjs_enrollments') || '[]');
    const list = document.getElementById('notificationList');
    document.getElementById('totalEnrollments').innerText = enrollments.length;

    list.innerHTML = '';

    if (enrollments.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-inbox fa-3x mb-3"></i>
          <h5>No applications yet</h5>
          <p>When students enroll in jobs, they will appear here.</p>
        </div>
      `;
      return;
    }

    // Display newest first
    enrollments.slice().reverse().forEach((enroll, index) => {
      const li = document.createElement('li');
      li.className = 'notification-item';
      li.innerHTML = `
        <div class="notification-icon">
          <i class="fas fa-user-graduate"></i>
        </div>
        <div class="flex-grow-1">
          <strong>${enroll.student}</strong> applied for <strong>${enroll.job}</strong>
          <div class="small opacity-75">${enroll.timestamp}</div>
        </div>
      `;
      list.appendChild(li);
    });
  }

  function clearNotifications() {
    if (confirm('Are you sure you want to clear all enrollment notifications?')) {
      localStorage.removeItem('hjs_enrollments');
      loadNotifications();
    }
  }

  // Load initially
  loadNotifications();

  // Poll for updates every 5 seconds so admin sees real-time updates
  setInterval(loadNotifications, 5000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
