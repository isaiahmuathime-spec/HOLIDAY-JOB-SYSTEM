<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clear Login Data</title>
  <script src="./data.js"></script>
</head>
<body>
  <h1>Clearing All Login Data...</h1>
  <script>
    // Clear all sessions
    HJSData.clearAdminSession();
    HJSData.clearStudentSession();
    
    // Clear all stored data
    localStorage.clear();
    
    console.log('All login data cleared successfully!');
    document.body.innerHTML = '<h1 style="color: green;">✓ All login data cleared successfully!</h1><p>You can now close this page and try logging in fresh.</p>';
  </script>
</body>
</html>
