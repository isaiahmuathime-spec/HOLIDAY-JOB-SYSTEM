<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holiday Job</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f4f7fb 0%, #e3f2fd 100%);
    }

    .top-bar {
      background: linear-gradient(90deg, #d62828, #1e5bb8);
      color: white;
      padding: 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #d62828;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .container-box {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1e5bb8;
    }

    .btn-info {
      width: 100%;
      background: linear-gradient(90deg, #d62828, #1e5bb8);
      border: none;
    }

    .btn-info:hover {
      background: linear-gradient(90deg, #b71c1c, #174a96);
    }

    .message {
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
    }

    .message.error { color: #d62828; }
    .message.success { color: #1e5bb8; }

    .student-subnav .nav-link {
      color: #1e5bb8;
      font-weight: 600;
    }

    .student-subnav .nav-link.active {
      background: linear-gradient(90deg, #d62828, #1e5bb8);
    }

    .form-section-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="logo-box">
        <img src="images/starehe logo.jpg" alt="Starehe Logo">
      </div>
      <h1>Holiday Job</h1>
    </div>
  </div>

  <div class="container-box">
    <h2 id="formTitle">Student Sign Up</h2>

    <ul class="nav nav-pills justify-content-center mb-3">
      <li class="nav-item">
        <button class="nav-link active" id="btnStudent" type="button">Student</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="btnAdmin" type="button">Administrator</button>
      </li>
    </ul>

    <ul class="nav nav-pills nav-fill student-subnav mb-4" id="studentSubnav">
      <li class="nav-item">
        <button class="nav-link active" id="btnSignUp" type="button">Sign Up</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="btnLogIn" type="button">Log In</button>
      </li>
    </ul>

    <form id="authForm">
      <div id="signupFields">
        <p class="form-section-label">Student Details</p>

        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control signup-field" id="studentName" placeholder="e.g. John Kamau">
          <div class="form-text">Your full name is used to log in.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Admission Number</label>
          <input type="text" class="form-control signup-field" id="admissionNumber" placeholder="e.g. ADM-2024-001">
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Form</label>
            <input type="text" class="form-control signup-field" id="studentForm" placeholder="e.g. Form 4">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Class</label>
            <input type="text" class="form-control signup-field" id="studentClass" placeholder="e.g. West">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control signup-field" id="studentEmail" placeholder="e.g. john.kamau@school.ac.ke">
        </div>

        <p class="form-section-label mt-2">Account Credentials</p>
      </div>

      <div class="mb-3" id="studentLoginNameWrap" style="display:none;">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="loginFullName" placeholder="Enter your full name">
        <div class="form-text">Use the same full name you signed up with.</div>
      </div>

      <div class="mb-3" id="adminUsernameWrap" style="display:none;">
        <label class="form-label">Admin Username</label>
        <input type="text" class="form-control" id="adminUsername" placeholder="Enter admin username">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
      </div>

      <div class="mb-3" id="confirmPasswordWrap">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password">
      </div>

      <button type="submit" class="btn btn-info" id="submitBtn">Create Account</button>
    </form>

    <div id="formMessage" class="message" role="alert"></div>
  </div>

  <script>
    const btnStudent = document.getElementById('btnStudent');
    const btnAdmin = document.getElementById('btnAdmin');
    const btnSignUp = document.getElementById('btnSignUp');
    const btnLogIn = document.getElementById('btnLogIn');
    const formTitle = document.getElementById('formTitle');
    const studentSubnav = document.getElementById('studentSubnav');
    const signupFields = document.getElementById('signupFields');
    const studentLoginNameWrap = document.getElementById('studentLoginNameWrap');
    const adminUsernameWrap = document.getElementById('adminUsernameWrap');
    const confirmPasswordWrap = document.getElementById('confirmPasswordWrap');
    const submitBtn = document.getElementById('submitBtn');
    const signupFieldEls = document.querySelectorAll('.signup-field');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const loginFullNameInput = document.getElementById('loginFullName');
    const adminUsernameInput = document.getElementById('adminUsername');

    let isAdminMode = false;
    let isSignUpMode = true;

    function setSignupRequired(required) {
      signupFieldEls.forEach(input => { input.required = required; });
      confirmPasswordInput.required = required;
    }

    function setStudentAuthMode(signUp) {
      isSignUpMode = signUp;
      btnSignUp.classList.toggle('active', signUp);
      btnLogIn.classList.toggle('active', !signUp);
      signupFields.style.display = signUp ? 'block' : 'none';
      studentLoginNameWrap.style.display = signUp ? 'none' : 'block';
      adminUsernameWrap.style.display = 'none';
      confirmPasswordWrap.style.display = signUp ? 'block' : 'none';
      formTitle.textContent = signUp ? 'Student Sign Up' : 'Student Log In';
      submitBtn.textContent = signUp ? 'Create Account' : 'Log In';
      loginFullNameInput.required = !signUp;
      adminUsernameInput.required = false;
      setSignupRequired(signUp);
    }

    function setLoginMode(admin) {
      isAdminMode = admin;
      btnStudent.classList.toggle('active', !admin);
      btnAdmin.classList.toggle('active', admin);
      studentSubnav.style.display = admin ? 'none' : 'flex';

      if (admin) {
        formTitle.textContent = 'Admin Login';
        submitBtn.textContent = 'Log In';
        signupFields.style.display = 'none';
        studentLoginNameWrap.style.display = 'none';
        adminUsernameWrap.style.display = 'block';
        confirmPasswordWrap.style.display = 'none';
        loginFullNameInput.required = false;
        adminUsernameInput.required = true;
        setSignupRequired(false);
        return;
      }

      setStudentAuthMode(isSignUpMode);
    }

    btnStudent.addEventListener('click', () => setLoginMode(false));
    btnAdmin.addEventListener('click', () => setLoginMode(true));
    btnSignUp.addEventListener('click', () => setStudentAuthMode(true));
    btnLogIn.addEventListener('click', () => setStudentAuthMode(false));

    const form = document.getElementById('authForm');
    const messageBox = document.getElementById('formMessage');

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      messageBox.textContent = '';
      messageBox.className = 'message';

      const password = document.getElementById('password').value;

      if (isAdminMode) {
        const adminUsername = adminUsernameInput.value.trim();
        const adminCredUsername = (typeof CONFIG !== 'undefined' && CONFIG.admin) ? CONFIG.admin.username : null;
        const adminPassword = (typeof CONFIG !== 'undefined' && CONFIG.admin) ? CONFIG.admin.password : null;

        if (!adminUsername || !password) {
          messageBox.textContent = 'Please enter your admin username and password.';
          messageBox.className = 'message error';
          return;
        }

        if (adminUsername === adminCredUsername && password === adminPassword) {
          localStorage.setItem('hjsAdminLoggedIn', 'true');
          messageBox.textContent = 'Admin login successful. Redirecting...';
          messageBox.className = 'message success';
          window.location.href = 'Admin.html';
          return;
        }

        messageBox.textContent = 'Incorrect admin username or password.';
        messageBox.className = 'message error';
        return;
      }

      if (isSignUpMode) {
        const name = document.getElementById('studentName').value.trim();
        const admissionNumber = document.getElementById('admissionNumber').value.trim();
        const studentForm = document.getElementById('studentForm').value.trim();
        const studentClass = document.getElementById('studentClass').value.trim();
        const email = document.getElementById('studentEmail').value.trim();
        const confirmPassword = confirmPasswordInput.value;

        if (!name || !admissionNumber || !studentForm || !studentClass || !email || !password) {
          messageBox.textContent = 'Please fill in your full name, admission number, form, class, email, and password.';
          messageBox.className = 'message error';
          return;
        }

        if (!isValidEmail(email)) {
          messageBox.textContent = 'Please enter a valid email address.';
          messageBox.className = 'message error';
          return;
        }

        if (password.length < 6) {
          messageBox.textContent = 'Password must be at least 6 characters long.';
          messageBox.className = 'message error';
          return;
        }

        if (password !== confirmPassword) {
          messageBox.textContent = 'Passwords do not match.';
          messageBox.className = 'message error';
          return;
        }

        const result = HJSData.registerStudent({
          name,
          admissionNumber,
          form: studentForm,
          studentClass,
          email,
          password
        });

        messageBox.textContent = result.message;
        messageBox.className = result.ok ? 'message success' : 'message error';

        if (result.ok) {
          form.reset();
          setTimeout(() => setStudentAuthMode(false), 1200);
        }
        return;
      }

      const fullName = loginFullNameInput.value.trim();
      if (!fullName || !password) {
        messageBox.textContent = 'Please enter your full name and password.';
        messageBox.className = 'message error';
        return;
      }

      const result = HJSData.loginStudent(fullName, password);
      if (!result.ok) {
        messageBox.textContent = result.message;
        messageBox.className = 'message error';
        return;
      }

      localStorage.setItem('hjsLoggedIn', 'true');
      messageBox.textContent = 'Login successful. Redirecting...';
      messageBox.className = 'message success';
      window.location.href = 'HJS.html';
    });

    setStudentAuthMode(true);
  </script>
</body>
</html>
