<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holiday Job</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
  <script src="config.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f4f7fb 0%, #e3f2fd 100%);
    }

    .top-bar {
      background: linear-gradient(90deg, #d62828, #1e5bb8);
      color: white;
      padding: 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #d62828;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .container-box {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1e5bb8;
    }

    .btn-info {
      width: 100%;
      background: linear-gradient(90deg, #d62828, #1e5bb8);
      border: none;
    }

    .btn-info:hover {
      background: linear-gradient(90deg, #b71c1c, #174a96);
    }

    .message {
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
    }

    .message.error {
      color: #d62828;
    }

    .message.success {
      color: #1e5bb8;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="logo-box">
        <img src="starehe logo.jpg" alt="Starehe Logo">
      </div>
      <h1>Holiday Job</h1>
    </div>
  </div>

  <div class="container-box">
    <h2 id="formTitle">Student Login</h2>
    
    <ul class="nav nav-pills justify-content-center mb-4">
      <li class="nav-item">
        <button class="nav-link active" id="btnStudent" type="button">Student</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="btnAdmin" type="button">Administrator</button>
      </li>
    </ul>

    <form id="studentlogin">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" id="username" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-info">Log In</button>
    </form>

    <div id="formMessage" class="message" role="alert"></div>
  </div>

  <script>
    const btnStudent = document.getElementById('btnStudent');
    const btnAdmin = document.getElementById('btnAdmin');
    const formTitle = document.getElementById('formTitle');
    const usernameInput = document.getElementById('username');

    btnStudent.addEventListener('click', () => {
      btnStudent.classList.add('active');
      btnAdmin.classList.remove('active');
      formTitle.textContent = 'Student Login';
      usernameInput.placeholder = 'Enter username';
    });

    btnAdmin.addEventListener('click', () => {
      btnAdmin.classList.add('active');
      btnStudent.classList.remove('active');
      formTitle.textContent = 'Admin Login';
      usernameInput.placeholder = 'Enter admin username';
    });

    const form = document.getElementById('studentlogin');
    const messageBox = document.getElementById('formMessage');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const validUsername = 'student';
      const validPassword = 'holidayjob';
      
      const adminUsername = (typeof CONFIG !== 'undefined' && CONFIG.admin) ? CONFIG.admin.username : null;
      const adminPassword = (typeof CONFIG !== 'undefined' && CONFIG.admin) ? CONFIG.admin.password : null;

      if (!username || !password) {
        messageBox.textContent = 'Please enter your username and password.';
        messageBox.className = 'message error';
        return;
      }

      if (username === adminUsername && password === adminPassword) {
        localStorage.setItem('hjsAdminLoggedIn', 'true');
        messageBox.textContent = 'Admin login successful. Redirecting...';
        messageBox.className = 'message success';
        window.location.href = 'Admin.html';
        return;
      }

      if (username !== validUsername || password !== validPassword) {
        messageBox.textContent = 'Incorrect username or password. Please try again.';
        messageBox.className = 'message error';
        return;
      }

      localStorage.setItem('hjsLoggedIn', 'true');
      messageBox.textContent = 'Login successful. Redirecting...';
      messageBox.className = 'message success';
      window.location.href = 'HJS.html';
    });
  </script>
</body>
</html>
